        </div>
        <div class="library m1 p1 rounded bg-grey">
          <div class="heading">
            <img class="invert" src="playlist.svg" alt="Playlist" />
            <h2>Your Library</h2>
          </div>
          <div class="songlist">
            <ul></ul>
          </div>
          <div class="footer">

                <span>Privacy Policy</span>
              </a>
            </div>

            <div>

              </a>
            </div>

            <div>
              <a href="https://www.spotify.com/pk-en/legal/privacy-policy/#s3">
                <span>About Ads</span>
              </a>
            </div>

            <div>
              <a href="https://www.spotify.com/pk-en/accessibility/">
                <span>Accessibility</span>
              </a>
            </div>
          </div>
        </div>
      </div>
